<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#A100FF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatientTriage.ai · Emergency triage console</title>
    <script>
      // Stamped before first paint. Without it a saved dark choice renders one
      // light frame while the bundle loads, which on a night shift is a flash
      // in a dim room.
      try {
        var t = localStorage.getItem('pt.theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) { /* storage blocked */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
